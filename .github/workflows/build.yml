name: Build and Distribute

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MissNovaMobile/package-lock.json

      - name: Install dependencies
        run: |
          cd MissNovaMobile
          npm install

      - name: Grant Gradle execute permission
        run: chmod +x MissNovaMobile/android/gradlew

      - name: Build Android Release APK
        run: |
          cd MissNovaMobile/android
          ./gradlew assembleRelease
        env:
          MYAPP_RELEASE_STORE_FILE: debug.keystore
          MYAPP_RELEASE_KEY_ALIAS: androiddebugkey
          MYAPP_RELEASE_STORE_PASSWORD: android
          MYAPP_RELEASE_KEY_PASSWORD: android

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissNova-Android-Release
          path: MissNovaMobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload to Firebase App Distribution
        if: ${{ secrets.FIREBASE_TOKEN != '' && secrets.FIREBASE_ANDROID_APP_ID != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: MissNovaMobile/android/app/build/outputs/apk/release/app-release.apk
