name: Build and Distribute

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MissNovaMobile/package-lock.json

      - name: Install dependencies
        run: cd MissNovaMobile && npm install

      - name: Build Android Release APK
        run: |
          cd MissNovaMobile/android
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          MYAPP_RELEASE_STORE_FILE: debug.keystore
          MYAPP_RELEASE_KEY_ALIAS: androiddebugkey
          MYAPP_RELEASE_STORE_PASSWORD: android
          MYAPP_RELEASE_KEY_PASSWORD: android

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissNova-Android-Release
          path: MissNovaMobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
